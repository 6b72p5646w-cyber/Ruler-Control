<text x="450" y="236" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">店内900格 ÷ 单屏180格 = 5屏</text>
<text x="450" y="278" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">移动</text>
<text x="450" y="303" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">左手摇杆；角色约0.6格碰撞直径</text>
<text x="450" y="345" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">操作</text>
<text x="450" y="370" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">右侧基础动作、快捷物和锁朝向</text>
<text x="450" y="412" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">尺度</text>
<text x="450" y="437" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">地图取放 / 工位安排 / 安全特写</text>
<text x="450" y="479" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">低SAN</text>
<text x="450" y="504" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">判定区变小、周边黑视；输入不乱跳</text>
<text x="450" y="546" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">保留</text>
<text x="450" y="571" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">HUD、退出、方向提示保持可读</text>
<text x="450" y="613" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">镜头</text>
<text x="450" y="638" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">跟随平移，无强制旋转或频繁切房</text>
<text x="450" y="680" font-size="14" fill="#88b8c8" font-weight="700" text-anchor="start">触控</text>
<text x="450" y="705" font-size="16" fill="#dfe9ed" font-weight="400" text-anchor="start">基础按钮46逻辑像素高，不随SAN缩小</text>
